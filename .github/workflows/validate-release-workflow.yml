name: Validate release workflow

on:
  pull_request:
    paths:
      - .github/CODEOWNERS
      - .github/actionlint.yaml
      - .github/chromium-release-policy.json
      - .github/workflows/**
      - scripts/**
      - tests/**
  push:
    branches:
      - main
    paths:
      - .github/CODEOWNERS
      - .github/actionlint.yaml
      - .github/chromium-release-policy.json
      - .github/workflows/**
      - scripts/**
      - tests/**

permissions:
  contents: read

concurrency:
  group: validate-release-workflow-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Policy and archive tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Compile Python tools
        run: python3 -m py_compile scripts/*.py tests/*.py

      - name: Check release queue and immutable refs
        run: ruby tests/test_release_workflow.rb

      - name: Install pinned Python linters
        shell: bash
        run: |
          set -euo pipefail
          lint_venv="$RUNNER_TEMP/release-lint-venv"
          python3 -m venv "$lint_venv"
          "$lint_venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-input \
            --no-cache-dir \
            --only-binary=:all: \
            --require-hashes \
            --index-url https://pypi.org/simple \
            -r .github/python-tools.txt
          echo "$lint_venv/bin" >> "$GITHUB_PATH"

      - name: Run Ruff
        run: ruff check scripts tests

      - name: Check Ruff formatting
        run: ruff format --check scripts tests

      - name: Run Pyright
        run: pyright --pythonversion 3.12 scripts tests

      - name: Run zizmor
        run: zizmor --pedantic .github/workflows/*.yml

      - name: Install pinned actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            --output "$archive" "$url"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          install_dir="$RUNNER_TEMP/actionlint"
          mkdir -m 700 "$install_dir"
          tar --extract --gzip --file="$archive" --directory="$install_dir" \
            --no-same-owner --no-same-permissions
          test -x "$install_dir/actionlint"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Lint GitHub workflows
        run: actionlint -config-file .github/actionlint.yaml
