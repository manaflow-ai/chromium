name: Validate release workflow

on:
  pull_request:
    paths:
      - .github/CODEOWNERS
      - .github/actionlint.yaml
      - .github/chromium-release-policy.json
      - .github/workflows/build-chromium.yml
      - .github/workflows/validate-release-workflow.yml
      - scripts/chromium_release_policy.py
      - scripts/validate_runtime_archive.py
      - tests/test_chromium_release_policy.py
      - tests/test_validate_runtime_archive.py
  push:
    branches:
      - main
    paths:
      - .github/CODEOWNERS
      - .github/actionlint.yaml
      - .github/chromium-release-policy.json
      - .github/workflows/build-chromium.yml
      - .github/workflows/validate-release-workflow.yml
      - scripts/chromium_release_policy.py
      - scripts/validate_runtime_archive.py
      - tests/test_chromium_release_policy.py
      - tests/test_validate_runtime_archive.py

permissions:
  contents: read

concurrency:
  group: validate-release-workflow-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Policy and archive tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Compile Python tools
        run: python3 -m py_compile scripts/*.py tests/*.py

      - name: Install pinned actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            --output "$archive" "$url"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          install_dir="$RUNNER_TEMP/actionlint"
          mkdir -m 700 "$install_dir"
          tar --extract --gzip --file="$archive" --directory="$install_dir" \
            --no-same-owner --no-same-permissions
          test -x "$install_dir/actionlint"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Lint GitHub workflows
        run: actionlint -config-file .github/actionlint.yaml
